spring:
  datasource:
    url: jdbc:h2:mem:edushare;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  mail:
    host: localhost
    port: 2525

jwt:
  signerKey: edushare-test-jwt-secret-that-is-at-least-sixty-four-bytes-long!
  valid-duration: 3600
  issuer: edushare-test

app:
  security:
    cookie:
      name: access_token
      secure: false
      same-site: Lax
      path: /
    cors:
      allowed-origins:
        - http://localhost:5173
    token-revocation:
      cleanup-cron: "0 0 3 * * *"
  google:
    client-id: google-test-client-id.apps.googleusercontent.com
    link-token-secret: edushare-test-google-link-secret-that-is-at-least-sixty-four-bytes-long
    link-token-expiration-minutes: 10
  otp:
    length: 6
    expiration-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-resends: 5
    hmac-secret: edushare-test-otp-hmac-secret-at-least-thirty-two-bytes

cloudflare:
  r2:
    account-id: test-account-id
    access-key-id: test-access-key-id
    secret-access-key: test-secret-access-key
    bucket-name: test-bucket
