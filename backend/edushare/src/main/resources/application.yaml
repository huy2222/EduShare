server:
    port: 8080
    servlet:
        context-path: /edushare
spring:
  datasource:
    #    url:  ${DB_URL:jdbc:mysql://localhost:3307/edushare}
    #    driver-class-name: com.mysql.cj.jdbc.Driver
    #    username: ${DB_USERNAME:root}
    #    password: ${DB_PASSWORD:root}
    url: jdbc:mysql://localhost:3307/edushare
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: "root"
    password: "root"
  jpa:
    open-in-view: false
    hibernate:
        ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
jwt:
  signerKey: ${JWT_SECRET_KEY:edushare-development-jwt-secret-change-in-production-minimum-64-bytes}
  valid-duration: 3600 # in seconds
  issuer: ${JWT_ISSUER:edushare}
app:
  security:
    admin-email: ${APP_ADMIN_EMAIL:}
    cookie:
      name: ${AUTH_COOKIE_NAME:access_token}
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_COOKIE_PATH:/}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    token-revocation:
      cleanup-cron: ${TOKEN_REVOCATION_CLEANUP_CRON:0 0 3 * * *}
  google:
    client-id: "310105857746-nkgfue9o4ps91tu0tmirlt47mibp5ik2.apps.googleusercontent.com"
    link-token-secret: ${GOOGLE_LINK_TOKEN_SECRET:edushare-development-google-link-secret-change-in-production-minimum-64-bytes}
    link-token-expiration-minutes: ${GOOGLE_LINK_TOKEN_EXPIRATION_MINUTES:10}
  otp:
    length: ${OTP_LENGTH:6}
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-resends: ${OTP_MAX_RESENDS:5}
    hmac-secret: ${OTP_HMAC_SECRET:${JWT_SECRET_KEY:edushare-development-jwt-secret-change-in-production-minimum-64-bytes}}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    bucket-name: ${R2_BUCKET_NAME}
