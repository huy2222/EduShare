server:
    port: 8080
    servlet:
        context-path: /edushare
spring:
  datasource:
    url: "jdbc:mysql://localhost:3307/edushare"
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: "root"
    password: "root"
  jpa:
    open-in-view: false
    hibernate:
        ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
jwt:
  signerKey: ${JWT_SECRET_KEY:edushare-development-jwt-secret-change-in-production-minimum-64-bytes}
  valid-duration: 3600 # in seconds
app:
  otp:
    expiration-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
